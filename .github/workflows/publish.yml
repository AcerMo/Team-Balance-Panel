name: Publish balance panel

on:
  workflow_dispatch:
    inputs:
      force:
        description: Run outside the hourly schedule
        type: boolean
        default: false

concurrency:
  group: team-balance-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      should_publish: ${{ steps.gate.outputs.should_publish }}
    steps:
      - name: Check hourly slot
        id: gate
        env:
          FORCE: ${{ inputs.force }}
        run: |
          minute=$(date -u +%M)
          if [ "$FORCE" = true ] || [ "$minute" -lt 10 ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.should_publish == 'true'
      - uses: actions/setup-python@v7
        if: steps.gate.outputs.should_publish == 'true'
        with:
          python-version: '3.12'
      - name: Build quota snapshot
        id: sync
        if: steps.gate.outputs.should_publish == 'true'
        env:
          GALAXY_PHONE: ${{ secrets.GALAXY_PHONE }}
          GALAXY_PASSWORD_MD5: ${{ secrets.GALAXY_PASSWORD_MD5 }}
        run: python sync.py
      - name: Pause workflow when login needs attention
        if: failure() && steps.sync.outputs.auth_blocked != ''
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_ERROR: ${{ steps.sync.outputs.auth_blocked }}
        run: |
          if [ "$AUTH_ERROR" = login_rejected ]; then
            previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/runs?per_page=5" \
              --jq '[.workflow_runs[] | select(.status == "completed")][0].conclusion')
            if [ "$previous" != failure ]; then
              echo "First login rejection; retrying at the next scheduled run."
              exit 0
            fi
          fi
          curl --fail --silent --show-error -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/publish.yml/disable"
      - uses: actions/upload-pages-artifact@v5
        if: steps.gate.outputs.should_publish == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: publish
        uses: actions/deploy-pages@v5
