<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f5f7fb">
  <title>团队额度看板</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow"><span class="mark" aria-hidden="true">◈</span> 团队共享 · 额度查询</div>
      <div class="heading"><div><h1>每一份额度，都清楚可见。</h1><p class="subtitle">查看所有成员的剩余额度与累计用量。</p></div><button id="refresh" type="button">刷新页面</button></div>
    </header>
    <section class="ledger" aria-labelledby="ledger-title">
      <div class="ledger-heading"><div><h2 id="ledger-title">成员余额</h2><span id="count" class="count">等待同步</span></div><span class="unit">金额单位：人民币 / 元</span></div>
      <div id="notice" class="notice" role="status" aria-live="polite">正在获取最新数据…</div>
      <div id="table-wrap" class="table-wrap" hidden>
        <table><thead><tr><th scope="col">成员</th><th scope="col" class="number">剩余额度</th><th scope="col" class="number secondary-col">总额度</th><th scope="col" class="number">已使用</th><th scope="col" class="status-col">状态</th></tr></thead><tbody id="rows"></tbody></table>
      </div>
      <div id="empty" class="empty" hidden><div class="empty-symbol" aria-hidden="true">↻</div><h3 id="empty-title">等待首次同步</h3><p id="empty-text">管理员完成连接后，所有成员的余额会在这里显示。</p></div>
      <div class="ledger-footer"><span id="updated">尚未同步</span><span id="interval">计划每 30 分钟同步一次</span></div>
    </section>
    <footer>额度信息以智星云后台实际记录为准。此页面仅供查询。</footer>
    <noscript><p>请启用浏览器 JavaScript 以查看余额。</p></noscript>
  </main>
</body>
</html>
